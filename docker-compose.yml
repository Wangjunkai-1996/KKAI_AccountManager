version: '3.8'

services:
  openai-login:
    build: .
    container_name: openai-login-web
    ports:
      - "8080:8080"
    env_file:
      - .sub2api.env
    environment:
      - HEADLESS=true
      - PORT=8080
    restart: unless-stopped
    # 如果需要使用代理
    # environment:
    #   - HTTP_PROXY=http://your-proxy:port
    #   - HTTPS_PROXY=http://your-proxy:port
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
