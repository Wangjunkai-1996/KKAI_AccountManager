services:
  openai-login:
    build: .
    image: openai-login-web:latest
    container_name: openai-login-web
    # Keep the management UI private by default; put an authenticated reverse
    # proxy in front of it when remote access is required.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .sub2api.env
    environment:
      OPENAI_LOGIN_DB: /app/data/accounts.db
      OPENAI_LOGIN_KEY: /app/data/accounts.key
    volumes:
      - auth-data:/app/data
    command: ["./openai-login-web", "-bind=0.0.0.0", "-headless=true", "-open-browser=false"]
    restart: unless-stopped
    # 如果需要使用代理
    # environment:
    #   - HTTP_PROXY=http://your-proxy:port
    #   - HTTPS_PROXY=http://your-proxy:port
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  auth-data:
    name: openai-login-data
